<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <!-- On-phone console: add ?debug to the URL (see README > Mobile Debugging) -->
  <script src="../eruda-debug.js"></script>
  <title>07 — p5.js · Image target · A-Frame</title>

  <!-- AR Libraries -->
  <script src="https://cdn.8thwall.com/web/aframe/8frame-1.3.0.min.js"></script>
  <script src="https://cdn.8thwall.com/web/xrextras/xrextras.js"></script>

  <!-- p5.js v1.9.4 (NOT v2.x — breaking changes to instance mode) -->
  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/p5.min.js"></script>

  <!-- 8th Wall Engine -->
  <script async src="../engine/xr.js" data-preload-chunks="slam"></script>

  <!-- Image Target Configuration -->
  <script>
    const onxrloaded = () => {
      XR8.XrController.configure({
        imageTargetData:[{
          "name": "my-poster",
          "type": "PLANAR",
          "imagePath": "../assets/Targets/Target_1000055040.jpg",
          "properties": {
            "left": 0, "top": 0,
            "width": 830, "height": 830,
            "originalWidth": 830, "originalHeight": 830,
            "isRotated": false
          }
        }]
      });
    };
    window.XR8 ? onxrloaded() : window.addEventListener('xrloaded', onxrloaded);
  </script>

  <!-- Custom component "p5-texture": runs a p5.js sketch on a hidden canvas and
       copies that canvas onto the 3D plane every frame (like a live image).
       To use your own sketch, you only need to edit p.draw (and p.setup) below. -->
  <script>
    AFRAME.registerComponent('p5-texture', {
      schema: {
        width: {type: 'int', default: 256},
        height: {type: 'int', default: 256}
      },
      init: function () {
        var self = this;
        var container = document.createElement('div');
        container.style.display = 'none';
        document.body.appendChild(container);
        this.container = container;

        // p5.js runs here in "instance mode": the sketch lives inside  function (p) { ... }
        // so every p5 function and variable needs "p." in front:
        // fill() -> p.fill(), ellipse() -> p.ellipse(), width -> p.width, millis() -> p.millis().
        // To use your own p5 sketch, paste it inside and add "p." everywhere.
        // The canvas is hidden; its pixels are copied onto the 3D plane every frame.
        this.p5Instance = new p5(function (p) {
          p.setup = function () {
            // Keep these 3 lines, otherwise the plane stays blank. The canvas size in
            // pixels comes from p5-texture="width: ...; height: ..." on the <a-plane> below.
            var c = p.createCanvas(self.data.width, self.data.height);
            c.parent(container);
            self.p5Canvas = c.elt;
          };
          p.draw = function () {
            // ===== YOUR p5 SKETCH GOES HERE =====
            // Constants need "p." too: TWO_PI -> p.TWO_PI.
            // p.clear() = transparent background (the image shows through).
            p.clear();
            var t = p.millis() * 0.001;
            for (var i = 0; i < 6; i++) {
              var angle = t + i * (p.TWO_PI / 6);
              var x = p.width / 2 + p.cos(angle) * 60;
              var y = p.height / 2 + p.sin(angle) * 60;
              p.noStroke();
              p.fill(
                127 + 127 * p.sin(t + i * 0.5),
                127 + 127 * p.sin(t + i * 0.7 + 2),
                127 + 127 * p.sin(t + i * 0.9 + 4),
                200
              );
              p.ellipse(x, y, 40 + 10 * p.sin(t * 2 + i), 40 + 10 * p.sin(t * 2 + i));
            }
            // Center circle
            p.fill(255);
            p.ellipse(p.width / 2, p.height / 2, 20 + 10 * p.sin(t * 3));
          };
        });
      },
      tick: function () {
        if (!this.p5Canvas) return;
        if (!this.texture) {
          this.texture = new THREE.CanvasTexture(this.p5Canvas);
          this.el.getObject3D('mesh').material.map = this.texture;
          this.el.getObject3D('mesh').material.needsUpdate = true;
        }
        this.texture.needsUpdate = true;
      },
      remove: function () {
        if (this.p5Instance) this.p5Instance.remove();
        if (this.container) this.container.remove();
      }
    });
  </script>
</head>
<body>
  <a-scene
    xrextras-gesture-detector
    xrextras-almost-there
    xrextras-loading
    xrextras-runtime-error
    vr-mode-ui="enabled: false"
    xrweb="disableWorldTracking: true">

    <a-camera position="0 4 10"></a-camera>

    <xrextras-named-image-target name="my-poster">

      <!-- p5.js sketch shown as a texture on a flat plane.
           shader: flat = no lighting (the colours stay exactly as drawn);
           transparent: true = the parts p.clear() leaves empty are see-through
           (without it they show as a black square).
           width/height = size in AR (1 unit = the height of the image).
           The plane lies flat on the image; y = 0.75 moves it up so its bottom
           edge sits at the centre of the image. -->
      <a-plane p5-texture="width: 256; height: 256"
               material="shader: flat; transparent: true"
               width="1.5" height="1.5"
               position="0 0.75 0">
      </a-plane>

    </xrextras-named-image-target>

  </a-scene>
</body>
</html>
