<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <!-- On-phone console: add ?debug to the URL (see README > Mobile Debugging) -->
  <script src="../eruda-debug.js"></script>
  <title>06 — Audio · Image target · A-Frame</title>

  <!-- AR Libraries -->
  <script src="https://cdn.8thwall.com/web/aframe/8frame-1.3.0.min.js"></script>
  <script src="https://cdn.8thwall.com/web/xrextras/xrextras.js"></script>

  <!-- 8th Wall Engine -->
  <script async src="../engine/xr.js" data-preload-chunks="slam"></script>

  <!-- Image Target Configuration -->
  <script>
    const onxrloaded = () => {
      XR8.XrController.configure({
        imageTargetData:[{
          "name": "my-poster",
          "type": "PLANAR",
          "imagePath": "../assets/Targets/Target_1000055040.jpg",
          "properties": {
            "left": 0, "top": 0,
            "width": 830, "height": 830,
            "originalWidth": 830, "originalHeight": 830,
            "isRotated": false
          }
        }]
      });
    };
    window.XR8 ? onxrloaded() : window.addEventListener('xrloaded', onxrloaded);
  </script>

  <!-- Custom component: plays/pauses audio when image target is found/lost.
       Events fire on <a-scene>, so we filter by event.detail.name.
       Browsers only allow sound after a user gesture (a tap): the camera finding
       the image is NOT a gesture, so the audio is unlocked on the first tap. -->
  <script>
    AFRAME.registerComponent('image-target-audio', {
      schema: {
        src: {type: 'string'},
        target: {type: 'string', default: 'my-poster'}
      },
      init: function () {
        this.audio = new Audio(this.data.src);
        this.audio.loop = true;
        this.targetVisible = false;

        this.onImageFound = (e) => {
          if (e.detail.name === this.data.target) {
            this.targetVisible = true;
            this.audio.play().catch(function (err) {
              console.warn('Audio could not play (not tapped yet, or wrong file path?):', err);
            });
          }
        };
        this.onImageLost = (e) => {
          if (e.detail.name === this.data.target) {
            this.targetVisible = false;
            this.audio.pause();
          }
        };

        // "Tap to enable sound" hint + one-time unlock
        this.hint = document.createElement('div');
        this.hint.textContent = 'Tap the screen once to enable sound';
        this.hint.style.cssText =
          'position:fixed; left:50%; bottom:24px; transform:translateX(-50%); z-index:10;' +
          'padding:8px 14px; border-radius:16px; background:rgba(0,0,0,0.6); color:#fff;' +
          'font:14px -apple-system, BlinkMacSystemFont, sans-serif; pointer-events:none;';
        document.body.appendChild(this.hint);

        this.unlock = () => {
          window.removeEventListener('touchend', this.unlock);
          window.removeEventListener('click', this.unlock);
          this.hint.remove();
          this.audio.play()
            .then(() => { if (!this.targetVisible) this.audio.pause(); })
            .catch((err) => console.warn('Audio unlock failed:', err));
        };
        window.addEventListener('touchend', this.unlock); // iOS
        window.addEventListener('click', this.unlock);    // desktop / Android

        this.el.sceneEl.addEventListener('xrimagefound', this.onImageFound);
        this.el.sceneEl.addEventListener('xrimagelost', this.onImageLost);
      },
      remove: function () {
        this.audio.pause();
        this.hint.remove();
        window.removeEventListener('touchend', this.unlock);
        window.removeEventListener('click', this.unlock);
        this.el.sceneEl.removeEventListener('xrimagefound', this.onImageFound);
        this.el.sceneEl.removeEventListener('xrimagelost', this.onImageLost);
      }
    });
  </script>
</head>
<body>
  <a-scene
    xrextras-gesture-detector
    xrextras-almost-there
    xrextras-loading
    xrextras-runtime-error
    vr-mode-ui="enabled: false"
    xrweb="disableWorldTracking: true">

    <a-camera position="0 4 10"></a-camera>

    <xrextras-named-image-target name="my-poster">

      <!-- Audio component: replace src with your own sound, and set target to the image's name.
           This entity can go anywhere in the scene: the sound is not positioned in 3D,
           it just plays while that image is visible. -->
      <a-entity image-target-audio="src: ../assets/634332__josefpres__bass-loops-077-with-drums-long-loop-120-bpm.mp3; target: my-poster"></a-entity>

      <!-- Visual speaker indicator. The shapes are built "Y-up" (like a speaker standing
           on a floor). On an image target Y runs along the paper, so this wrapper turns
           them 90 degrees around X to stand up OUT of the image (same trick as the models
           in example 04). Without it, half of the speaker would be inside the paper. -->
      <a-entity rotation="90 0 0">
        <a-cylinder color="#333333" radius="0.15" height="0.05"
                    position="0 0.025 0"></a-cylinder>
        <a-cone color="#555555" radius-bottom="0.15" radius-top="0.05" height="0.3"
                position="0 0.2 0"></a-cone>
      </a-entity>

      <!-- Animated sound rings: flat like the paper, floating 0.3 in front of it
           around the top of the speaker -->
      <a-ring color="#00AAFF" radius-inner="0.25" radius-outer="0.28"
              position="0 0 0.3" rotation="0 0 0" opacity="0.6"
              animation="property: scale; from: 1 1 1; to: 2 2 2;
                         loop: true; dur: 1500; easing: easeOutQuad"
              animation__fade="property: opacity; from: 0.6; to: 0;
                               loop: true; dur: 1500; easing: easeOutQuad">
      </a-ring>

      <a-ring color="#00AAFF" radius-inner="0.25" radius-outer="0.28"
              position="0 0 0.3" rotation="0 0 0" opacity="0.6"
              animation="property: scale; from: 1 1 1; to: 2 2 2;
                         loop: true; dur: 1500; delay: 500; easing: easeOutQuad"
              animation__fade="property: opacity; from: 0.6; to: 0;
                               loop: true; dur: 1500; delay: 500; easing: easeOutQuad">
      </a-ring>

      <a-text value="Audio Playing" color="white" align="center"
              position="0 0.8 0" width="3"></a-text>

    </xrextras-named-image-target>

  </a-scene>
</body>
</html>
