<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <!-- On-phone console: add ?debug to the URL (see README > Mobile Debugging) -->
  <script src="../eruda-debug.js"></script>
  <title>04 — 3D Models · Image target · A-Frame</title>

  <!-- AR Libraries -->
  <script src="https://cdn.8thwall.com/web/aframe/8frame-1.3.0.min.js"></script>
  <script src="https://cdn.8thwall.com/web/xrextras/xrextras.js"></script>

  <!-- aframe-extras for animation-mixer component -->
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.6.1/dist/aframe-extras.min.js"></script>

  <!-- 8th Wall Engine -->
  <script async src="../engine/xr.js" data-preload-chunks="slam"></script>

  <!-- Image Target Configuration -->
  <script>
    const onxrloaded = () => {
      XR8.XrController.configure({
        imageTargetData:[{
          "name": "my-poster",
          "type": "PLANAR",
          "imagePath": "../assets/Targets/Target_1000055040.jpg",
          "properties": {
            "left": 0, "top": 0,
            "width": 830, "height": 830,
            "originalWidth": 830, "originalHeight": 830,
            "isRotated": false
          }
        }]
      });
    };
    window.XR8 ? onxrloaded() : window.addEventListener('xrloaded', onxrloaded);
  </script>
</head>
<body>
  <a-scene
    xrextras-gesture-detector
    xrextras-almost-there
    xrextras-loading
    xrextras-runtime-error
    vr-mode-ui="enabled: false"
    xrweb="disableWorldTracking: true">

    <!-- Preload the 3D models (.glb files, e.g. exported from Blender or downloaded from Sketchfab).
         To use your own: put it in assets/ and change src, e.g. src="../assets/my-model.glb"
         (file names are case-sensitive).
         Keep the id: it is used below as gltf-model="#model1" / "#model2". -->
    <a-assets>
      <a-asset-item id="model1" src="../assets/plant_modelling.glb"></a-asset-item>
      <a-asset-item id="model2" src="../assets/satanim3.glb"></a-asset-item>
    </a-assets>

    <a-camera position="0 4 10"></a-camera>

    <xrextras-named-image-target name="my-poster">

      <!-- How the models are placed:
           - rotation="90 0 0": models are made "Y-up" (Blender, Sketchfab...), but on an
             image target Y runs along the paper. Turning 90 degrees around X makes them
             stand up OUT of the image instead of lying flat on it.
           - scale: 1 unit = the height of the image. Models come in all sizes:
             try 0.1, 0.05... until yours fits.
           - position: this image is square (1 unit wide), so x = -0.5 is its left edge
             and x = 0.5 its right edge. -->

      <!-- Model 1: a plant (no animation). gltf-model loads the .glb file. -->
      <a-entity gltf-model="#model1"
                position="-0.5 0 0"
                rotation="90 0 0"
                scale="0.1 0.1 0.1">
      </a-entity>

      <!-- Model 2: an animated character. animation-mixer (from aframe-extras, loaded in
           <head>) plays the animations stored in the .glb: clip: * = all of them,
           loop: repeat = forever. -->
      <a-entity gltf-model="#model2"
                animation-mixer="clip: *; loop: repeat"
                position="0.5 0 0"
                rotation="90 0 0"
                scale="0.05 0.05 0.05">
      </a-entity>

    </xrextras-named-image-target>

  </a-scene>
</body>
</html>
