<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <!-- On-phone console: add ?debug to the URL (see README > Mobile Debugging) -->
  <script src="../eruda-debug.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>08 — Gaussian Splat · Image target · Three.js</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
    canvas { display: block; position: fixed; top: 0; left: 0; width: 100% !important; height: 100% !important; }
  </style>

  <!-- Import map: tells the browser where to download the libraries that the
       code below loads with  import ... from 'three'.  Change a version number
       here (e.g. three@0.178.0) and every import uses it.
       "?external=three" on the Spark line: Spark reuses the "three" above instead of
       downloading its own copy (two copies of Three.js break rendering). -->
  <script type="importmap">
  { "imports": {
      "three": "https://esm.sh/three@0.178.0",
      "three/addons/": "https://esm.sh/three@0.178.0/examples/jsm/",
      "@sparkjsdev/spark": "https://esm.sh/@sparkjsdev/spark@0.1.10?external=three"
  } }
  </script>

  <!-- 8th Wall Engine -->
  <script async src="../engine/xr.js" data-preload-chunks="slam"></script>
</head>
<body>
  <canvas id="xr-canvas"></canvas>

  <script type="module">
    import * as THREE from 'three';
    import { SplatMesh } from '@sparkjsdev/spark';
    import { startXR8, applyTargetPose } from './lib/xr8-three-bootstrap.js';

    // Hidden until the camera finds the image (onImageFound shows it)
    const group = new THREE.Group();
    group.visible = false;

    // --- Gaussian Splat via Spark.js ---
    // Spark.js needs Three.js r178+, so it works directly here (the A-Frame
    // version needs a workaround, see README > Known limitations).
    // Formats: .sog (smallest, used here), .spz, .ply, .splat, .ksplat.
    const splat = new SplatMesh({ url: '../assets/flower_14p.sog' });
    // z = 0.5 lifts it out of the image so its base sits on the paper
    // (the same as y = 0.5 on the floor in world_Threejs/08: here Z points out of the image)
    splat.position.set(0, 0, 0.5);
    splat.scale.set(0.2, 0.2, 0.2);
    // Many splat files are stored upside down (their "up" points along -Y), unlike
    // the .glb models in 04, which use +Math.PI / 2. Turning -90° around X makes this
    // one stand up out of the image. With your own splat, if it looks upside down
    // or lies flat, try Math.PI / 2 or Math.PI here.
    splat.rotation.x = -Math.PI / 2;
    group.add(splat);

    // --- Start XR8 ---
    const { scene } = await startXR8({
      canvas: document.getElementById('xr-canvas'),
      imageTargets: [{
        name: 'my-poster',
        type: 'PLANAR',
        imagePath: '../assets/Targets/Target_1000055040.jpg',
        properties: {
          left: 0, top: 0,
          width: 830, height: 830,
          originalWidth: 830, originalHeight: 830,
          isRotated: false
        }
      }],
      onImageFound: (detail) => {
        applyTargetPose(group, detail);
        group.visible = true;
      },
      onImageUpdated: (detail) => {
        applyTargetPose(group, detail);
      },
      onImageLost: () => {
        group.visible = false;
      }
    });

    scene.add(group);
  </script>
</body>
</html>
