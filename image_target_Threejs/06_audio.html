<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <!-- On-phone console: add ?debug to the URL (see README > Mobile Debugging) -->
  <script src="../eruda-debug.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>06 — Audio · Image target · Three.js</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
    canvas { display: block; position: fixed; top: 0; left: 0; width: 100% !important; height: 100% !important; }
  </style>

  <!-- Import map: tells the browser where to download the libraries that the
       code below loads with  import ... from 'three'.  Change a version number
       here (e.g. three@0.178.0) and every import uses it. -->
  <script type="importmap">
  { "imports": {
      "three": "https://esm.sh/three@0.178.0",
      "three/addons/": "https://esm.sh/three@0.178.0/examples/jsm/"
  } }
  </script>

  <!-- 8th Wall Engine -->
  <script async src="../engine/xr.js" data-preload-chunks="slam"></script>
</head>
<body>
  <canvas id="xr-canvas"></canvas>

  <script type="module">
    import * as THREE from 'three';
    import { startXR8, applyTargetPose } from './lib/xr8-three-bootstrap.js';

    // Hidden until the camera finds the image (onImageFound shows it)
    const group = new THREE.Group();
    group.visible = false;

    // --- Audio ---
    const audio = new Audio('../assets/634332__josefpres__bass-loops-077-with-drums-long-loop-120-bpm.mp3');
    audio.loop = true;
    let targetVisible = false;

    // Browsers only allow sound after a user gesture (a tap). The camera finding
    // the image is NOT a gesture, so we unlock the audio on the first tap.
    const soundHint = document.createElement('div');
    soundHint.textContent = 'Tap the screen once to enable sound';
    soundHint.style.cssText =
      'position:fixed; left:50%; bottom:24px; transform:translateX(-50%); z-index:10;' +
      'padding:8px 14px; border-radius:16px; background:rgba(0,0,0,0.6); color:#fff;' +
      'font:14px -apple-system, BlinkMacSystemFont, sans-serif; pointer-events:none;';
    document.body.appendChild(soundHint);

    function unlockAudio() {
      window.removeEventListener('touchend', unlockAudio);
      window.removeEventListener('click', unlockAudio);
      soundHint.remove();
      audio.play()
        .then(() => { if (!targetVisible) audio.pause(); })
        .catch((err) => console.warn('Audio unlock failed:', err));
    }
    window.addEventListener('touchend', unlockAudio); // iOS
    window.addEventListener('click', unlockAudio);    // desktop / Android

    // --- Speaker visual ---
    // The shapes are built "Y-up" (like a speaker standing on a floor). On an image
    // target Y runs along the paper, so this wrapper group turns them 90 degrees
    // around X to stand up OUT of the image (same trick as the models in example 04).
    const speaker = new THREE.Group();
    speaker.rotation.x = Math.PI / 2;
    group.add(speaker);

    const speakerBase = new THREE.Mesh(
      new THREE.CylinderGeometry(0.15, 0.15, 0.05, 32),
      new THREE.MeshStandardMaterial({ color: 0x333333 })
    );
    speakerBase.position.set(0, 0.025, 0);
    speaker.add(speakerBase);

    const speakerCone = new THREE.Mesh(
      new THREE.ConeGeometry(0.15, 0.3, 32),
      new THREE.MeshStandardMaterial({ color: 0x555555 })
    );
    speakerCone.position.set(0, 0.2, 0);
    speaker.add(speakerCone);

    // --- Sound rings: flat like the paper, floating 0.3 in front of it ---
    const ringMat = new THREE.MeshBasicMaterial({
      color: 0x00AAFF, transparent: true, opacity: 0.6, side: THREE.DoubleSide
    });
    const ring1 = new THREE.Mesh(new THREE.RingGeometry(0.25, 0.28, 32), ringMat.clone());
    ring1.position.set(0, 0, 0.3);
    group.add(ring1);

    const ring2 = new THREE.Mesh(new THREE.RingGeometry(0.25, 0.28, 32), ringMat.clone());
    ring2.position.set(0, 0, 0.3);
    group.add(ring2);

    // --- Text label (sprite) ---
    const canvas = document.createElement('canvas');
    canvas.width = 512; canvas.height = 128;
    const ctx = canvas.getContext('2d');
    ctx.font = 'bold 40px Arial';
    ctx.fillStyle = '#ffffff';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('Audio Playing', 256, 64);
    const labelTex = new THREE.CanvasTexture(canvas);
    labelTex.colorSpace = THREE.SRGBColorSpace; // keeps the colour you chose (see README)
    const textSprite = new THREE.Sprite(
      new THREE.SpriteMaterial({ map: labelTex, transparent: true })
    );
    textSprite.scale.set(3, 0.75, 1);
    textSprite.position.set(0, 0.8, 0);
    group.add(textSprite);

    // --- Start XR8 ---
    const { scene } = await startXR8({
      canvas: document.getElementById('xr-canvas'),
      imageTargets: [{
        name: 'my-poster',
        type: 'PLANAR',
        imagePath: '../assets/Targets/Target_1000055040.jpg',
        properties: {
          left: 0, top: 0,
          width: 830, height: 830,
          originalWidth: 830, originalHeight: 830,
          isRotated: false
        }
      }],
      onImageFound: (detail) => {
        applyTargetPose(group, detail);
        group.visible = true;
        targetVisible = true;
        audio.play().catch((err) => console.warn('Audio could not play (not tapped yet, or wrong file path?):', err));
      },
      onImageUpdated: (detail) => {
        applyTargetPose(group, detail);
      },
      onImageLost: () => {
        group.visible = false;
        targetVisible = false;
        audio.pause();
      },
      onRenderLoop: () => {
        const t = performance.now() * 0.001;

        // Ring 1: expand + fade (1.5s loop)
        const phase1 = (t % 1.5) / 1.5;
        const s1 = 1 + phase1;
        ring1.scale.set(s1, s1, s1);
        ring1.material.opacity = 0.6 * (1 - phase1);

        // Ring 2: same loop, shifted by 1 s (in a 1.5 s loop, that puts it 0.5 s behind ring 1)
        const phase2 = ((t + 1.0) % 1.5) / 1.5;
        const s2 = 1 + phase2;
        ring2.scale.set(s2, s2, s2);
        ring2.material.opacity = 0.6 * (1 - phase2);
      }
    });

    scene.add(group);
  </script>
</body>
</html>
