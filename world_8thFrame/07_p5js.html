<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>07 — p5.js (World Effect)</title>
  <script src="https://cdn.8thwall.com/web/aframe/8frame-1.3.0.min.js"></script>
  <script src="https://cdn.8thwall.com/web/xrextras/xrextras.js"></script>
  <script async src="../engine/xr.js" data-preload-chunks="slam"></script>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/p5.min.js"></script>

  <script>
    AFRAME.registerComponent('tap-to-place', {
      init: function () {
        this.placed = false;
        this.el.setAttribute('visible', false);
        this.onTap = (e) => {
          if (this.placed) return;
          const cam = this.el.sceneEl.camera;
          const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(cam.quaternion);
          const pos = new THREE.Vector3().copy(cam.position).add(dir.multiplyScalar(2));
          pos.y = 0;
          this.el.setAttribute('position', pos);
          this.el.setAttribute('visible', true);
          this.placed = true;
        };
        this.el.sceneEl.canvas.addEventListener('touchstart', this.onTap);
        this.el.sceneEl.canvas.addEventListener('click', this.onTap);
      },
      remove: function () {
        this.el.sceneEl.canvas.removeEventListener('touchstart', this.onTap);
        this.el.sceneEl.canvas.removeEventListener('click', this.onTap);
      }
    });
  </script>

  <script>
    AFRAME.registerComponent('p5-texture', {
      schema: {
        width:  {type: 'int', default: 256},
        height: {type: 'int', default: 256}
      },
      init: function () {
        var el = this.el;
        var w = this.data.width;
        var h = this.data.height;

        var sketch = function (p) {
          p.setup = function () {
            p.createCanvas(w, h);
            p.background(30);
          };
          p.draw = function () {
            p.background(30, 20);
            var cx = w / 2;
            var cy = h / 2;
            var t = p.millis() * 0.001;
            for (var i = 0; i < 6; i++) {
              var angle = t + i * (p.TWO_PI / 6);
              var x = cx + p.cos(angle) * 60;
              var y = cy + p.sin(angle) * 60;
              p.noStroke();
              p.fill((i * 60) % 360, 200, 255);
              p.colorMode(p.HSB);
              p.ellipse(x, y, 30, 30);
            }
          };
        };

        var instance = new p5(sketch);
        var canvas = instance.canvas || document.querySelector('.p5Canvas');

        var texture = new THREE.CanvasTexture(canvas);
        this._interval = setInterval(function () {
          texture.needsUpdate = true;
        }, 33);

        el.getObject3D('mesh').material.map = texture;
        el.getObject3D('mesh').material.needsUpdate = true;
      },
      remove: function () {
        if (this._interval) clearInterval(this._interval);
      }
    });
  </script>
</head>
<body>
  <a-scene
    xrextras-gesture-detector
    xrextras-almost-there
    xrextras-loading
    xrextras-runtime-error
    vr-mode-ui="enabled: false"
    xrweb="disableWorldTracking: false">

    <a-camera position="0 4 10"></a-camera>

    <a-entity tap-to-place>
      <a-plane p5-texture="width: 256; height: 256"
               material="shader: flat"
               width="1.5" height="1.5"
               position="0 0.75 0">
      </a-plane>
    </a-entity>

  </a-scene>
</body>
</html>
