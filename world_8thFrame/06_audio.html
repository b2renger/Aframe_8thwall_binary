<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <!-- On-phone console: add ?debug to the URL (see README > Mobile Debugging) -->
  <script src="../eruda-debug.js"></script>
  <title>06 — Audio · World · A-Frame</title>
  <script src="https://cdn.8thwall.com/web/aframe/8frame-1.3.0.min.js"></script>
  <script src="https://cdn.8thwall.com/web/xrextras/xrextras.js"></script>
  <script async src="../engine/xr.js" data-preload-chunks="slam"></script>
  <!-- tap-to-place / tap-to-cycle components (shared by all world examples) -->
  <script src="lib/tap-to-place.js"></script>

  <!-- world-audio: starts a looping sound when the content is placed.
       Browsers only allow sound after the user taps the screen; here the tap that
       places the content counts, so no extra "tap to enable sound" step is needed
       (unlike image_target_8thFrame/06_audio.html). -->
  <script>
    AFRAME.registerComponent('world-audio', {
      schema: { src: {type: 'string'} },
      init: function () {
        this.audio = new Audio(this.data.src);
        this.audio.loop = true;
        // 'tap-placed' is sent by lib/tap-to-place.js when you tap to place the content
        this.el.sceneEl.addEventListener('tap-placed', () => {
          this.audio.play().catch(e => console.warn('Audio play blocked:', e));
        });
      },
      remove: function () {
        if (this.audio) { this.audio.pause(); this.audio = null; }
      }
    });
  </script>

</head>
<body>
  <a-scene
    xrextras-gesture-detector
    xrextras-almost-there
    xrextras-loading
    xrextras-runtime-error
    vr-mode-ui="enabled: false"
    xrweb="disableWorldTracking: false">

    <!-- Start position of the phone. Its height (4) sets the scale: 4 units ≈ the
         phone's real height above the floor (about 1.2–1.5 m), so 1 unit ≈ 30–40 cm.
         A bigger height makes everything look smaller, a smaller one makes it look bigger.
         The floor is y = 0. See README > Coordinates and units. -->
    <a-camera position="0 4 10"></a-camera>

    <!-- tap-to-place: everything inside stays hidden until you tap the floor. It then
         appears where you tapped, turned to face you. Positions inside are measured
         from that spot: y = 0 is the floor, so give an object a y of half its height
         to stand on it. (How it works: lib/tap-to-place.js) -->
    <a-entity tap-to-place>
      <!-- Replace src with your own .mp3 (path is relative to this HTML file) -->
      <a-entity world-audio="src: ../assets/634332__josefpres__bass-loops-077-with-drums-long-loop-120-bpm.mp3"></a-entity>
      <a-cylinder color="#333333" radius="0.15" height="0.05" position="0 0.025 0"></a-cylinder>
      <a-cone color="#555555" radius-bottom="0.15" radius-top="0.05" height="0.3" position="0 0.2 0"></a-cone>
      <!-- Animated sound rings, lying flat (rotation -90 0 0) around the top of the speaker
           like ripples: standing upright, they would sink into the floor as they grow. -->
      <a-ring color="#00AAFF" radius-inner="0.25" radius-outer="0.28" position="0 0.3 0" rotation="-90 0 0" opacity="0.6"
              animation="property: scale; from: 1 1 1; to: 2 2 2; loop: true; dur: 1500; easing: easeOutQuad"
              animation__fade="property: opacity; from: 0.6; to: 0; loop: true; dur: 1500; easing: easeOutQuad"></a-ring>
      <a-ring color="#00AAFF" radius-inner="0.25" radius-outer="0.28" position="0 0.3 0" rotation="-90 0 0" opacity="0.6"
              animation="property: scale; from: 1 1 1; to: 2 2 2; loop: true; dur: 1500; delay: 500; easing: easeOutQuad"
              animation__fade="property: opacity; from: 0.6; to: 0; loop: true; dur: 1500; delay: 500; easing: easeOutQuad"></a-ring>
      <a-text value="Audio Playing" color="white" align="center" position="0 0.8 0" width="3"></a-text>
    </a-entity>

  </a-scene>
</body>
</html>
