<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>06 — Audio (World Effect)</title>
  <script src="https://cdn.8thwall.com/web/aframe/8frame-1.3.0.min.js"></script>
  <script src="https://cdn.8thwall.com/web/xrextras/xrextras.js"></script>
  <script async src="../engine/xr.js" data-preload-chunks="slam"></script>

  <!-- World-audio: plays audio when content is placed -->
  <script>
    AFRAME.registerComponent('world-audio', {
      schema: { src: {type: 'string'} },
      init: function () {
        this.audio = new Audio(this.data.src);
        this.audio.loop = true;
        // Play when parent becomes visible (placed)
        this.el.sceneEl.addEventListener('tap-placed', () => {
          this.audio.play().catch(e => console.warn('Audio play blocked:', e));
        });
      },
      remove: function () {
        if (this.audio) { this.audio.pause(); this.audio = null; }
      }
    });
  </script>

  <!-- Tap-to-place: places content on first detected surface tap -->
  <script>
    AFRAME.registerComponent('tap-to-place', {
      init: function () {
        this.placed = false;
        this.el.setAttribute('visible', false);
        this.camera = document.querySelector('a-camera') || document.querySelector('[camera]');

        this.onTap = (e) => {
          if (this.placed) return;
          const touch = e.touches ? e.touches[0] : e;
          const cam = this.el.sceneEl.camera;
          const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(cam.quaternion);
          const pos = new THREE.Vector3().copy(cam.position).add(dir.multiplyScalar(2));
          pos.y = 0;
          this.el.setAttribute('position', pos);
          this.el.setAttribute('visible', true);
          this.placed = true;
          this.el.sceneEl.emit('tap-placed');
        };
        this.el.sceneEl.canvas.addEventListener('touchstart', this.onTap);
        this.el.sceneEl.canvas.addEventListener('click', this.onTap);
      },
      remove: function () {
        this.el.sceneEl.canvas.removeEventListener('touchstart', this.onTap);
        this.el.sceneEl.canvas.removeEventListener('click', this.onTap);
      }
    });
  </script>
</head>
<body>
  <a-scene
    xrextras-gesture-detector
    xrextras-almost-there
    xrextras-loading
    xrextras-runtime-error
    vr-mode-ui="enabled: false"
    xrweb="disableWorldTracking: false">

    <a-camera position="0 4 10"></a-camera>

    <a-entity tap-to-place>
      <a-entity world-audio="src: ../assets/634332__josefpres__bass-loops-077-with-drums-long-loop-120-bpm.mp3"></a-entity>
      <a-cylinder color="#333333" radius="0.15" height="0.05" position="0 0.025 0"></a-cylinder>
      <a-cone color="#555555" radius-bottom="0.15" radius-top="0.05" height="0.3" position="0 0.2 0"></a-cone>
      <a-ring color="#00AAFF" radius-inner="0.25" radius-outer="0.28" position="0 0.3 0" rotation="0 0 0" opacity="0.6"
              animation="property: scale; from: 1 1 1; to: 2 2 2; loop: true; dur: 1500; easing: easeOutQuad"
              animation__fade="property: opacity; from: 0.6; to: 0; loop: true; dur: 1500; easing: easeOutQuad"></a-ring>
      <a-ring color="#00AAFF" radius-inner="0.25" radius-outer="0.28" position="0 0.3 0" rotation="0 0 0" opacity="0.6"
              animation="property: scale; from: 1 1 1; to: 2 2 2; loop: true; dur: 1500; delay: 500; easing: easeOutQuad"
              animation__fade="property: opacity; from: 0.6; to: 0; loop: true; dur: 1500; delay: 500; easing: easeOutQuad"></a-ring>
      <a-text value="Audio Playing" color="white" align="center" position="0 0.8 0" width="3"></a-text>
    </a-entity>

  </a-scene>
</body>
</html>
