<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>09 — Multi Placement (World Effect)</title>
  <script src="https://cdn.8thwall.com/web/aframe/8frame-1.3.0.min.js"></script>
  <script src="https://cdn.8thwall.com/web/xrextras/xrextras.js"></script>
  <script async src="../engine/xr.js" data-preload-chunks="slam"></script>

  <script>
    AFRAME.registerComponent('tap-to-place', {
      init: function () {
        this.placed = false;
        this.el.setAttribute('visible', false);
        this.onTap = (e) => {
          if (this.placed) return;
          const cam = this.el.sceneEl.camera;
          const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(cam.quaternion);
          const pos = new THREE.Vector3().copy(cam.position).add(dir.multiplyScalar(2));
          pos.y = 0;
          this.el.setAttribute('position', pos);
          this.el.setAttribute('visible', true);
          this.placed = true;
        };
        this.el.sceneEl.canvas.addEventListener('touchstart', this.onTap);
        this.el.sceneEl.canvas.addEventListener('click', this.onTap);
      },
      remove: function () {
        this.el.sceneEl.canvas.removeEventListener('touchstart', this.onTap);
        this.el.sceneEl.canvas.removeEventListener('click', this.onTap);
      }
    });
  </script>

  <script>
    AFRAME.registerComponent('tap-to-cycle', {
      init: function () {
        this.items = Array.from(this.el.children).filter(c => c.tagName.startsWith('A-'));
        this.index = 0;
        // Hide all initially
        this.items.forEach(item => item.setAttribute('visible', false));

        this.onTap = (e) => {
          if (this.index >= this.items.length) return;
          const item = this.items[this.index];
          const cam = this.el.sceneEl.camera;
          const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(cam.quaternion);
          const pos = new THREE.Vector3().copy(cam.position).add(dir.multiplyScalar(2));
          pos.y = 0;
          // Offset each placement slightly so they don't overlap
          pos.x += (Math.random() - 0.5) * 0.5;
          pos.z += (Math.random() - 0.5) * 0.5;
          item.setAttribute('position', pos);
          item.setAttribute('visible', true);
          this.index++;
        };
        this.el.sceneEl.canvas.addEventListener('touchstart', this.onTap);
        this.el.sceneEl.canvas.addEventListener('click', this.onTap);
      },
      remove: function () {
        this.el.sceneEl.canvas.removeEventListener('touchstart', this.onTap);
        this.el.sceneEl.canvas.removeEventListener('click', this.onTap);
      }
    });
  </script>
</head>
<body>
  <a-scene
    xrextras-gesture-detector
    xrextras-almost-there
    xrextras-loading
    xrextras-runtime-error
    vr-mode-ui="enabled: false"
    xrweb="disableWorldTracking: false">

    <a-camera position="0 4 10"></a-camera>

    <a-entity tap-to-cycle>
      <!-- Object A -->
      <a-entity>
        <a-box color="#FF0055" position="0 0.5 0"
               animation="property: rotation; to: 0 360 0; loop: true; dur: 4000; easing: linear"></a-box>
        <a-text value="Object A" color="red" align="center" position="0 1.2 0" width="3"></a-text>
      </a-entity>

      <!-- Object B -->
      <a-entity>
        <a-sphere color="#00AAFF" position="0 0.5 0" radius="0.4"
                  animation="property: position; from: 0 0.5 0; to: 0 1.0 0;
                             loop: true; dur: 1500; dir: alternate; easing: easeInOutQuad"></a-sphere>
        <a-text value="Object B" color="blue" align="center" position="0 1.2 0" width="3"></a-text>
      </a-entity>

      <!-- Object C -->
      <a-entity>
        <a-sphere color="#FFAAFF" position="0 0.5 0" radius="0.4"
                  animation="property: position; from: 0 0.5 0; to: 0 1.0 0;
                             loop: true; dur: 1500; dir: alternate; easing: easeInOutQuad"></a-sphere>
        <a-text value="Object C" color="purple" align="center" position="0 1.2 0" width="3"></a-text>
      </a-entity>

      <!-- Object D -->
      <a-entity>
        <a-cylinder color="#FF00AA" position="0 0.4 0" radius="0.3" height="0.8"
                    animation="property: rotation; to: 360 0 0; loop: true; dur: 3000; easing: linear"></a-cylinder>
        <a-text value="Object D" color="pink" align="center" position="0 1.2 0" width="3"></a-text>
      </a-entity>

      <!-- Object E -->
      <a-entity>
        <a-cone color="#33CC33" position="0 0.45 0" radius-bottom="0.35" radius-top="0" height="0.8"
                animation="property: scale; from: 1 1 1; to: 1.3 1.3 1.3;
                           loop: true; dur: 1200; dir: alternate; easing: easeInOutSine"></a-cone>
        <a-text value="Object E" color="green" align="center" position="0 1.2 0" width="3"></a-text>
      </a-entity>

      <!-- Object F -->
      <a-entity>
        <a-torus color="#AA00FF" position="0 0.5 0" radius="0.3" radius-tubular="0.06"
                 animation="property: rotation; to: 360 360 0; loop: true; dur: 5000; easing: linear"></a-torus>
        <a-text value="Object F" color="purple" align="center" position="0 1.2 0" width="3"></a-text>
      </a-entity>

      <!-- Object G -->
      <a-entity>
        <a-ring color="#FFAA00" position="0 0.5 0" radius-inner="0.15" radius-outer="0.35"
                animation="property: rotation; to: 0 0 360; loop: true; dur: 3500; easing: linear"></a-ring>
        <a-text value="Object G" color="orange" align="center" position="0 1.2 0" width="3"></a-text>
      </a-entity>
    </a-entity>

  </a-scene>
</body>
</html>
