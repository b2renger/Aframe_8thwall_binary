<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>03 — Images (World Effect)</title>
  <script src="https://cdn.8thwall.com/web/aframe/8frame-1.3.0.min.js"></script>
  <script src="https://cdn.8thwall.com/web/xrextras/xrextras.js"></script>
  <script async src="../engine/xr.js" data-preload-chunks="slam"></script>

  <!-- Tap-to-place: places content on first detected surface tap -->
  <script>
    AFRAME.registerComponent('tap-to-place', {
      init: function () {
        this.placed = false;
        this.el.setAttribute('visible', false);
        this.camera = document.querySelector('a-camera') || document.querySelector('[camera]');

        this.onTap = (e) => {
          if (this.placed) return;
          const touch = e.touches ? e.touches[0] : e;
          const cam = this.el.sceneEl.camera;
          const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(cam.quaternion);
          const pos = new THREE.Vector3().copy(cam.position).add(dir.multiplyScalar(2));
          pos.y = 0;
          this.el.setAttribute('position', pos);
          this.el.setAttribute('visible', true);
          this.placed = true;
        };
        this.el.sceneEl.canvas.addEventListener('touchstart', this.onTap);
        this.el.sceneEl.canvas.addEventListener('click', this.onTap);
      },
      remove: function () {
        this.el.sceneEl.canvas.removeEventListener('touchstart', this.onTap);
        this.el.sceneEl.canvas.removeEventListener('click', this.onTap);
      }
    });
  </script>
</head>
<body>
  <a-scene
    xrextras-gesture-detector
    xrextras-almost-there
    xrextras-loading
    xrextras-runtime-error
    vr-mode-ui="enabled: false"
    xrweb="disableWorldTracking: false">

    <a-assets>
      <img id="export1" src="../assets/Export_1.png" crossorigin="anonymous">
    </a-assets>

    <a-camera position="0 4 10"></a-camera>

    <a-entity tap-to-place>
      <a-image src="#export1" position="0 0.3 0" width="1.5" height="1.5"></a-image>
      <a-image src="#export1" position="0 0.3 0.3" width="1.5" height="1.5"></a-image>
      <a-image src="#export1" position="0 0.3 0.6" width="1.5" height="1.5"></a-image>
    </a-entity>

  </a-scene>
</body>
</html>
