<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <!-- On-phone console: add ?debug to the URL (see README > Mobile Debugging) -->
  <script src="../eruda-debug.js"></script>
  <title>05 — Video Chroma (green screen) · World · A-Frame</title>
  <script src="https://cdn.8thwall.com/web/aframe/8frame-1.3.0.min.js"></script>
  <script src="https://cdn.8thwall.com/web/xrextras/xrextras.js"></script>
  <script async src="../engine/xr.js" data-preload-chunks="slam"></script>
  <!-- tap-to-place / tap-to-cycle components (shared by all world examples) -->
  <script src="lib/tap-to-place.js"></script>

  <!-- Chromakey shader: makes one colour of a video transparent (green-screen effect).
       For each pixel it measures how close its colour is to `color`; close = transparent.
       Use it like this: material="shader: chromakey; src: #vid; color: #00FF00"
       (the video plane at the bottom of this page does exactly that). -->
  <script>
    AFRAME.registerShader('chromakey', {
      schema: {
        src: {type: 'map'},
        color: {type: 'color', default: '#00FF00'},
        chroma: {type: 'boolean', default: true}
      },
      init: function (data) {
        var videoTexture = new THREE.VideoTexture(data.src);
        videoTexture.minFilter = THREE.LinearFilter;
        this.material = new THREE.ShaderMaterial({
          transparent: true,
          uniforms: {
            myTexture: {value: videoTexture},
            color: {value: new THREE.Color(data.color)},
            chroma: {value: data.chroma}
          },
          vertexShader: [
            'varying vec2 vUv;',
            'void main(void) {',
            '  vUv = uv;',
            '  gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);',
            '}'
          ].join('\n'),
          fragmentShader: [
            'uniform sampler2D myTexture;',
            'uniform vec3 color;',
            'uniform bool chroma;',
            'varying vec2 vUv;',
            'void main(void) {',
            '  vec3 tColor = texture2D(myTexture, vUv).rgb;',
            '  float a = 1.0;',
            // In  a = (length(tColor - color) - 0.75) * 7.0 :
            // 0.75 = how close to the key colour a pixel must be to disappear
            //        (raise it to remove more of the background, lower it if parts of the subject vanish)
            // 7.0  = edge sharpness (higher = harder edge)
            '  if (chroma) { a = (length(tColor - color) - 0.75) * 7.0; }',
            '  gl_FragColor = vec4(tColor, a);',
            '}'
          ].join('\n')
        });
      },
      update: function (data) {
        this.material.uniforms.color.value.set(data.color);
        this.material.uniforms.chroma.value = data.chroma;
      }
    });
  </script>

</head>
<body>
  <a-scene
    xrextras-gesture-detector
    xrextras-almost-there
    xrextras-loading
    xrextras-runtime-error
    vr-mode-ui="enabled: false"
    xrweb="disableWorldTracking: false">

    <a-assets>
      <video id="vid" src="../assets/mask_green_sil.mp4" loop crossorigin="anonymous" playsinline muted autoplay></video>
    </a-assets>

    <!-- Start position of the phone. Its height (4) sets the scale: 4 units ≈ the
         phone's real height above the floor (about 1.2–1.5 m), so 1 unit ≈ 30–40 cm.
         A bigger height makes everything look smaller, a smaller one makes it look bigger.
         The floor is y = 0. See README > Coordinates and units. -->
    <a-camera position="0 4 10"></a-camera>

    <!-- tap-to-place: everything inside stays hidden until you tap the floor. It then
         appears where you tapped, turned to face you. Positions inside are measured
         from that spot: y = 0 is the floor, so give an object a y of half its height
         to stand on it. (How it works: lib/tap-to-place.js) -->
    <a-entity tap-to-place>
      <!-- color = the background colour to remove (#00FF00 green; use #0000FF for the
           blue test videos, #FF0000 for the red ones).
           width / height must keep the video's proportions: the video is 640 x 360 (16:9),
           so width 2 -> height 1.125.
           y = 0.5625 is half that height, so the bottom edge of the video sits on the floor. -->
      <a-entity geometry="primitive: plane; width: 2; height: 1.125"
                material="shader: chromakey; src: #vid; chroma: true; color: #00FF00;"
                position="0 0.5625 0"></a-entity>
    </a-entity>

  </a-scene>
</body>
</html>
