<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>05 — Video Chroma (World Effect)</title>
  <script src="https://cdn.8thwall.com/web/aframe/8frame-1.3.0.min.js"></script>
  <script src="https://cdn.8thwall.com/web/xrextras/xrextras.js"></script>
  <script async src="../engine/xr.js" data-preload-chunks="slam"></script>

  <!-- Chromakey shader -->
  <script>
    AFRAME.registerShader('chromakey', {
      schema: {
        src: {type: 'map'},
        color: {type: 'color', default: '#00FF00'},
        chroma: {type: 'boolean', default: true}
      },
      init: function (data) {
        var videoTexture = new THREE.VideoTexture(data.src);
        videoTexture.minFilter = THREE.LinearFilter;
        this.material = new THREE.ShaderMaterial({
          transparent: true,
          uniforms: {
            myTexture: {value: videoTexture},
            color: {value: new THREE.Color(data.color)},
            chroma: {value: data.chroma}
          },
          vertexShader: [
            'varying vec2 vUv;',
            'void main(void) {',
            '  vUv = uv;',
            '  gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);',
            '}'
          ].join('\n'),
          fragmentShader: [
            'uniform sampler2D myTexture;',
            'uniform vec3 color;',
            'uniform bool chroma;',
            'varying vec2 vUv;',
            'void main(void) {',
            '  vec3 tColor = texture2D(myTexture, vUv).rgb;',
            '  float a = 1.0;',
            '  if (chroma) { a = (length(tColor - color) - 0.75) * 7.0; }',
            '  gl_FragColor = vec4(tColor, a);',
            '}'
          ].join('\n')
        });
      },
      update: function (data) {
        this.material.uniforms.color.value.set(data.color);
        this.material.uniforms.chroma.value = data.chroma;
      }
    });
  </script>

  <!-- Tap-to-place: places content on first detected surface tap -->
  <script>
    AFRAME.registerComponent('tap-to-place', {
      init: function () {
        this.placed = false;
        this.el.setAttribute('visible', false);
        this.camera = document.querySelector('a-camera') || document.querySelector('[camera]');

        this.onTap = (e) => {
          if (this.placed) return;
          const touch = e.touches ? e.touches[0] : e;
          const cam = this.el.sceneEl.camera;
          const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(cam.quaternion);
          const pos = new THREE.Vector3().copy(cam.position).add(dir.multiplyScalar(2));
          pos.y = 0;
          this.el.setAttribute('position', pos);
          this.el.setAttribute('visible', true);
          this.placed = true;
        };
        this.el.sceneEl.canvas.addEventListener('touchstart', this.onTap);
        this.el.sceneEl.canvas.addEventListener('click', this.onTap);
      },
      remove: function () {
        this.el.sceneEl.canvas.removeEventListener('touchstart', this.onTap);
        this.el.sceneEl.canvas.removeEventListener('click', this.onTap);
      }
    });
  </script>
</head>
<body>
  <a-scene
    xrextras-gesture-detector
    xrextras-almost-there
    xrextras-loading
    xrextras-runtime-error
    vr-mode-ui="enabled: false"
    xrweb="disableWorldTracking: false">

    <a-assets>
      <video id="vid" src="../assets/mask_green_sil.mp4" loop crossorigin="anonymous" playsinline muted autoplay></video>
    </a-assets>

    <a-camera position="0 4 10"></a-camera>

    <a-entity tap-to-place>
      <a-entity geometry="primitive: plane; width: 2; height: 1.5"
                material="shader: chromakey; src: #vid; chroma: true; color: #00FF00;"
                position="0 0.0 0"></a-entity>
    </a-entity>

  </a-scene>
</body>
</html>
