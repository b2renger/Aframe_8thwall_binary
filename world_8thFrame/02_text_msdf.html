<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>02 — Text MSDF (World Effect)</title>
  <script src="https://cdn.8thwall.com/web/aframe/8frame-1.3.0.min.js"></script>
  <script src="https://cdn.8thwall.com/web/xrextras/xrextras.js"></script>
  <script async src="../engine/xr.js" data-preload-chunks="slam"></script>

  <!-- Tap-to-place: places content on first detected surface tap -->
  <script>
    AFRAME.registerComponent('tap-to-place', {
      init: function () {
        this.placed = false;
        this.el.setAttribute('visible', false);
        this.camera = document.querySelector('a-camera') || document.querySelector('[camera]');

        this.onTap = (e) => {
          if (this.placed) return;
          const touch = e.touches ? e.touches[0] : e;
          const cam = this.el.sceneEl.camera;
          const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(cam.quaternion);
          const pos = new THREE.Vector3().copy(cam.position).add(dir.multiplyScalar(2));
          pos.y = 0;
          this.el.setAttribute('position', pos);
          this.el.setAttribute('visible', true);
          this.placed = true;
        };
        this.el.sceneEl.canvas.addEventListener('touchstart', this.onTap);
        this.el.sceneEl.canvas.addEventListener('click', this.onTap);
      },
      remove: function () {
        this.el.sceneEl.canvas.removeEventListener('touchstart', this.onTap);
        this.el.sceneEl.canvas.removeEventListener('click', this.onTap);
      }
    });
  </script>
</head>
<body>
  <a-scene
    xrextras-gesture-detector
    xrextras-almost-there
    xrextras-loading
    xrextras-runtime-error
    vr-mode-ui="enabled: false"
    xrweb="disableWorldTracking: false">

    <a-camera position="0 4 10"></a-camera>

    <a-entity tap-to-place>
      <a-text value="Default Roboto (SDF)" color="white" align="center" position="0 2.0 0" width="3"></a-text>
      <a-entity text="value: Creepster MSDF; shader: msdf; font: https://raw.githubusercontent.com/etiennepinchon/aframe-fonts/master/fonts/creepster/Creepster-Regular.json; color: #FF0055; align: center; width: 4" position="0 1.4 0"></a-entity>
      <a-entity text="value: Berkshire Swash; shader: msdf; font: https://raw.githubusercontent.com/etiennepinchon/aframe-fonts/master/fonts/berkshireswash/BerkshireSwash-Regular.json; color: #00AAFF; align: center; width: 4" position="0 0.8 0"></a-entity>
      <a-entity text="value: Crimson Text; shader: msdf; font: https://raw.githubusercontent.com/etiennepinchon/aframe-fonts/master/fonts/crimsontext/CrimsonText-Regular.json; color: #33CC33; align: center; width: 4" position="0 0.2 0"></a-entity>
      <a-entity text="value: Small (width 2); shader: msdf; font: https://raw.githubusercontent.com/etiennepinchon/aframe-fonts/master/fonts/creepster/Creepster-Regular.json; color: #FFAA00; align: center; width: 2" position="0 -0.4 0"></a-entity>
      <a-entity text="value: Large (width 6); shader: msdf; font: https://raw.githubusercontent.com/etiennepinchon/aframe-fonts/master/fonts/creepster/Creepster-Regular.json; color: #FFAA00; align: center; width: 6" position="0 -0.9 0"></a-entity>
    </a-entity>

  </a-scene>
</body>
</html>
