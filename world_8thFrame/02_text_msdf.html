<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <!-- On-phone console: add ?debug to the URL (see README > Mobile Debugging) -->
  <script src="../eruda-debug.js"></script>
  <title>02 — Text &amp; Fonts · World · A-Frame</title>
  <script src="https://cdn.8thwall.com/web/aframe/8frame-1.3.0.min.js"></script>
  <script src="https://cdn.8thwall.com/web/xrextras/xrextras.js"></script>
  <script async src="../engine/xr.js" data-preload-chunks="slam"></script>
  <!-- tap-to-place / tap-to-cycle components (shared by all world examples) -->
  <script src="lib/tap-to-place.js"></script>

</head>
<body>
  <a-scene
    xrextras-gesture-detector
    xrextras-almost-there
    xrextras-loading
    xrextras-runtime-error
    vr-mode-ui="enabled: false"
    xrweb="disableWorldTracking: false">

    <!-- Start position of the phone. Its height (4) sets the scale: 4 units ≈ the
         phone's real height above the floor (about 1.2–1.5 m), so 1 unit ≈ 30–40 cm.
         A bigger height makes everything look smaller, a smaller one makes it look bigger.
         The floor is y = 0. See README > Coordinates and units. -->
    <a-camera position="0 4 10"></a-camera>

    <!-- tap-to-place: everything inside stays hidden until you tap the floor. It then
         appears where you tapped, turned to face you. Positions inside are measured
         from that spot: y = 0 is the floor, so give an object a y of half its height
         to stand on it. (How it works: lib/tap-to-place.js) -->
    <a-entity tap-to-place>
      <!-- Every line has a y above 0, so no text sinks into the floor. -->

      <!-- 1. Default A-Frame text (built-in Roboto font).
           <a-text> is the simplest way to write text. -->
      <a-text value="Default Roboto"
              color="white" align="center"
              position="0 3.2 0" width="3"></a-text>

      <!-- 2. MSDF font: Creepster (stays sharp at any size).
           An MSDF font needs two settings inside text="...":
             - shader: msdf
             - font: the URL of the font's .json file (its .png image is loaded automatically)
           Each setting is written "name: value;". You can put them on separate lines to make them easier to read. -->
      <a-entity text="value: Creepster MSDF;
                      shader: msdf;
                      font: https://raw.githubusercontent.com/etiennepinchon/aframe-fonts/master/fonts/creepster/Creepster-Regular.json;
                      color: #FF0055;
                      align: center;
                      width: 4"
               position="0 2.6 0"></a-entity>

      <!-- 3. MSDF font: Berkshire Swash -->
      <a-entity text="value: Berkshire Swash;
                      shader: msdf;
                      font: https://raw.githubusercontent.com/etiennepinchon/aframe-fonts/master/fonts/berkshireswash/BerkshireSwash-Regular.json;
                      color: #00AAFF;
                      align: center;
                      width: 4"
               position="0 2.0 0"></a-entity>

      <!-- 4. MSDF font: Crimson Text -->
      <a-entity text="value: Crimson Text;
                      shader: msdf;
                      font: https://raw.githubusercontent.com/etiennepinchon/aframe-fonts/master/fonts/crimsontext/CrimsonText-Regular.json;
                      color: #33CC33;
                      align: center;
                      width: 4"
               position="0 1.4 0"></a-entity>

      <!-- 5. Size: 'width' is the width of the text block, so a bigger width = bigger letters -->
      <a-entity text="value: Small (width 2);
                      shader: msdf;
                      font: https://raw.githubusercontent.com/etiennepinchon/aframe-fonts/master/fonts/creepster/Creepster-Regular.json;
                      color: #FFAA00;
                      align: center;
                      width: 2"
               position="0 0.8 0"></a-entity>

      <a-entity text="value: Large (width 6);
                      shader: msdf;
                      font: https://raw.githubusercontent.com/etiennepinchon/aframe-fonts/master/fonts/creepster/Creepster-Regular.json;
                      color: #FFAA00;
                      align: center;
                      width: 6"
               position="0 0.3 0"></a-entity>
    </a-entity>

  </a-scene>
</body>
</html>
