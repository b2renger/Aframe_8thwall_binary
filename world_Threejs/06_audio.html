<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>06 — Audio (World Effect)</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
    canvas { display: block; position: fixed; top: 0; left: 0; width: 100% !important; height: 100% !important; }
  </style>
  <script type="importmap">
  { "imports": {
      "three": "https://esm.sh/three@0.178.0",
      "three/addons/": "https://esm.sh/three@0.178.0/examples/jsm/"
  } }
  </script>
  <script async src="../engine/xr.js" data-preload-chunks="slam"></script>
</head>
<body>
  <canvas id="xr-canvas"></canvas>
  <script type="module">
    import * as THREE from 'three';
    import { startXR8World } from './lib/xr8-three-world-bootstrap.js';

    const group = new THREE.Group();
    group.position.set(0, -9999, 0);

    // Speaker base
    const base = new THREE.Mesh(
      new THREE.CylinderGeometry(0.15, 0.15, 0.05, 32),
      new THREE.MeshStandardMaterial({ color: 0x333333 })
    );
    base.position.y = 0.025;
    group.add(base);

    // Speaker cone
    const speakerCone = new THREE.Mesh(
      new THREE.ConeGeometry(0.15, 0.3, 32),
      new THREE.MeshStandardMaterial({ color: 0x555555 })
    );
    speakerCone.position.y = 0.2;
    group.add(speakerCone);

    // Animated rings
    const ringGeo = new THREE.RingGeometry(0.25, 0.28, 32);
    const ringMat = new THREE.MeshBasicMaterial({ color: 0x00AAFF, transparent: true, opacity: 0.6, side: THREE.DoubleSide });
    const ring1 = new THREE.Mesh(ringGeo, ringMat.clone());
    ring1.position.y = 0.3;
    group.add(ring1);
    const ring2 = new THREE.Mesh(ringGeo, ringMat.clone());
    ring2.position.y = 0.3;
    group.add(ring2);

    let audio = null;
    let placed = false;

    const { scene } = await startXR8World({
      canvas: document.getElementById('xr-canvas'),
      onTapPlace: (pos) => {
        if (placed) return;
        group.position.copy(pos);
        placed = true;
        audio = new Audio('../assets/634332__josefpres__bass-loops-077-with-drums-long-loop-120-bpm.mp3');
        audio.loop = true;
        audio.play().catch(e => console.warn('Audio blocked:', e));
      },
      onRenderLoop: (ctx, delta) => {
        if (!placed) return;
        const t = performance.now() * 0.001;
        // Animate rings - pulsing scale and fading opacity
        const s1 = 1 + (t % 1.5) / 1.5;
        ring1.scale.set(s1, s1, s1);
        ring1.material.opacity = 0.6 * (1 - (t % 1.5) / 1.5);
        const s2 = 1 + ((t + 0.5) % 1.5) / 1.5;
        ring2.scale.set(s2, s2, s2);
        ring2.material.opacity = 0.6 * (1 - ((t + 0.5) % 1.5) / 1.5);
      }
    });
    scene.add(group);
  </script>
</body>
</html>
