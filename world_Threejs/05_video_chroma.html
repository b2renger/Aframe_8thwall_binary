<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <!-- On-phone console: add ?debug to the URL (see README > Mobile Debugging) -->
  <script src="../eruda-debug.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>05 — Video Chroma (green screen) · World · Three.js</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
    canvas { display: block; position: fixed; top: 0; left: 0; width: 100% !important; height: 100% !important; }
  </style>
  <!-- Import map: tells the browser where to download the libraries that the
       code below loads with  import ... from 'three'.  Change a version number
       here (e.g. three@0.178.0) and every import uses it. -->
  <script type="importmap">
  { "imports": {
      "three": "https://esm.sh/three@0.178.0",
      "three/addons/": "https://esm.sh/three@0.178.0/examples/jsm/"
  } }
  </script>
  <script async src="../engine/xr.js" data-preload-chunks="slam"></script>
</head>
<body>
  <canvas id="xr-canvas"></canvas>
  <script type="module">
    import * as THREE from 'three';
    import { startXR8World } from './lib/xr8-three-world-bootstrap.js';

    const group = new THREE.Group();
    group.visible = false; // hidden until you tap the floor to place it

    const video = document.createElement('video');
    video.src = '../assets/mask_green_sil.mp4';
    video.loop = true;
    video.muted = true;
    video.playsInline = true;
    video.crossOrigin = 'anonymous';

    const videoTexture = new THREE.VideoTexture(video);
    videoTexture.minFilter = THREE.LinearFilter;

    const chromakeyMaterial = new THREE.ShaderMaterial({
      transparent: true,
      uniforms: {
        myTexture: { value: videoTexture },
        // color = the background colour to remove (0x00FF00 green; use 0x0000FF
        // for the blue test videos, 0xFF0000 for the red ones).
        color: { value: new THREE.Color(0x00FF00) },
        chroma: { value: true } // false = show the video unchanged
      },
      vertexShader: `
        varying vec2 vUv;
        void main(void) {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform sampler2D myTexture;
        uniform vec3 color;
        uniform bool chroma;
        varying vec2 vUv;
        void main(void) {
          vec3 tColor = texture2D(myTexture, vUv).rgb;
          float a = 1.0;
          // 0.75 = how close to the key colour a pixel must be to disappear
          // (raise it to remove more of the background, lower it if parts of the
          // subject vanish); 7.0 = edge sharpness (higher = harder edge).
          if (chroma) { a = (length(tColor - color) - 0.75) * 7.0; }
          gl_FragColor = vec4(tColor, a);
        }
      `
    });

    // Width and height must keep the video's proportions: the mask_*.mp4
    // videos are 640 x 360 (16:9), so 2 wide => 2 * 360 / 640 = 1.125 high.
    const plane = new THREE.Mesh(
      new THREE.PlaneGeometry(2, 1.125),
      chromakeyMaterial
    );
    plane.position.y = 1.125 / 2; // half the plane's height, so its bottom edge sits on the floor (y = 0)
    group.add(plane);

    // onTapPlace runs on every tap; `placed` makes only the first tap count.
    let placed = false;
    const { scene } = await startXR8World({
      canvas: document.getElementById('xr-canvas'),
      onTapPlace: (pos, _state, rotY) => {
        if (placed) return;
        group.position.copy(pos);
        group.rotation.y = rotY;
        group.visible = true;
        placed = true;
        video.play().catch(err => console.warn('Video play blocked:', err));
      }
    });
    scene.add(group);
  </script>
</body>
</html>
