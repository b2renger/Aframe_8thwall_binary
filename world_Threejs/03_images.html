<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <!-- On-phone console: add ?debug to the URL (see README > Mobile Debugging) -->
  <script src="../eruda-debug.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>03 — Images · World · Three.js</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
    canvas { display: block; position: fixed; top: 0; left: 0; width: 100% !important; height: 100% !important; }
  </style>
  <!-- Import map: tells the browser where to download the libraries that the
       code below loads with  import ... from 'three'.  Change a version number
       here (e.g. three@0.178.0) and every import uses it. -->
  <script type="importmap">
  { "imports": {
      "three": "https://esm.sh/three@0.178.0",
      "three/addons/": "https://esm.sh/three@0.178.0/examples/jsm/"
  } }
  </script>
  <script async src="../engine/xr.js" data-preload-chunks="slam"></script>
</head>
<body>
  <canvas id="xr-canvas"></canvas>
  <script type="module">
    import * as THREE from 'three';
    import { startXR8World } from './lib/xr8-three-world-bootstrap.js';

    const group = new THREE.Group();
    group.visible = false; // hidden until you tap the floor to place it

    const loader = new THREE.TextureLoader();
    const tex = await loader.loadAsync('../assets/export1.png');
    tex.colorSpace = THREE.SRGBColorSpace; // color image: without this it looks washed out
    const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true });
    for (let i = 0; i < 3; i++) {
      const plane = new THREE.Mesh(new THREE.PlaneGeometry(1.5, 1.5), mat.clone());
      plane.position.set(0, 0.75, i * 0.3); // 0.75 = half of 1.5, so the bottom edge sits on the floor
      group.add(plane);
    }

    // onTapPlace runs on every tap; `placed` makes only the first tap count.
    let placed = false;
    const { scene } = await startXR8World({
      canvas: document.getElementById('xr-canvas'),
      onTapPlace: (pos, _state, rotY) => {
        if (placed) return;
        group.position.copy(pos);
        group.rotation.y = rotY;
        group.visible = true;
        placed = true;
      }
    });
    scene.add(group);
  </script>
</body>
</html>
