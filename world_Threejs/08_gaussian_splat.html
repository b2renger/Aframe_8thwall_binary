<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>08 — Gaussian Splat (World Effect)</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
    canvas { display: block; position: fixed; top: 0; left: 0; width: 100% !important; height: 100% !important; }
  </style>
  <script type="importmap">
  { "imports": {
      "three": "https://esm.sh/three@0.178.0",
      "three/addons/": "https://esm.sh/three@0.178.0/examples/jsm/",
      "@sparkjsdev/spark": "https://esm.sh/@sparkjsdev/spark@0.1.10?external=three"
  } }
  </script>
  <script async src="../engine/xr.js" data-preload-chunks="slam"></script>
</head>
<body>
  <canvas id="xr-canvas"></canvas>
  <script type="module">
    import * as THREE from 'three';
    import { SplatMesh } from '@sparkjsdev/spark';
    import { startXR8World } from './lib/xr8-three-world-bootstrap.js';

    const group = new THREE.Group();
    group.position.set(0, -9999, 0);

    // Gaussian Splat via Spark.js
    const splat = new SplatMesh({ url: '../assets/splat_30000.sog' });
    splat.position.set(0, 0.5, 0);
    splat.scale.set(0.2, 0.2, 0.2);
    splat.rotation.x = -Math.PI / 2;
    group.add(splat);

    let placed = false;
    const { scene, camera } = await startXR8World({
      canvas: document.getElementById('xr-canvas'),
      onTapPlace: (pos) => {
        if (placed) return;
        group.position.copy(pos);
        placed = true;
      },
      onRenderLoop: () => {
        if (splat.update) splat.update(camera);
      }
    });
    scene.add(group);
  </script>
</body>
</html>
